<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RomSync Web</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt=""><span>RomSync <small>Web</small></span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="platforms" class="on">Plataformas</button>
    <button data-tab="bios">BIOS</button>
    <button data-tab="saves">Partidas</button>
    <button data-tab="tools">Herramientas</button>
  </nav>
  <div class="storage-pill" id="storagePill"></div>
</header>

<main>
  <section id="tab-platforms" class="tab on">
    <aside class="systems" id="systems"></aside>
    <div class="content">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Buscar juego…" autocomplete="off">
        <div class="chips" id="filters">
          <button data-f="tablet" class="on">En el dispositivo</button>
          <button data-f="pc">En el servidor</button>
          <button data-f="all">Todos</button>
        </div>
        <select id="sort" aria-label="Ordenar">
          <option value="name">Nombre</option>
          <option value="size">Tamaño</option>
        </select>
        <button class="ghost" id="uploadBtn" title="Subir ROMs a la plataforma elegida">Subir ROMs</button>
        <button class="ghost" id="refreshBtn" title="Volver a leer el dispositivo y el servidor">Actualizar</button>
        <input type="file" id="uploadInput" multiple hidden>
      </div>
      <div class="summary" id="summary"></div>
      <div id="connectBanner"></div>
      <div class="drop" id="drop" hidden>Suelta los archivos para subirlos a <b id="dropTo"></b></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </div>
  </section>

  <section id="tab-bios" class="tab"><div class="page" id="biosPage"></div></section>
  <section id="tab-saves" class="tab"><div class="page" id="savesPage"></div></section>
  <section id="tab-tools" class="tab"><div class="page" id="toolsPage"></div></section>
</main>

<div class="transfers" id="transfers" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<div class="login" id="login" hidden>
  <form class="card" id="loginForm">
    <img src="icon.svg" alt="" width="56">
    <h2>RomSync Web</h2>
    <p>Escribe el PIN que aparece en el dispositivo (RomSync → Web).</p>
    <input id="loginPin" maxlength="6" placeholder="······" autocomplete="off" autocapitalize="characters">
    <button class="primary" type="submit">Entrar</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
