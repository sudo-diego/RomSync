<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RomSync</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt=""><span>RomSync</span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="library" class="on">Biblioteca</button>
    <button data-tab="tablet">Tablet</button>
    <button data-tab="saves">Partidas</button>
    <button data-tab="settings">Ajustes</button>
  </nav>
  <div class="storage-pill" id="storagePill" hidden></div>
</header>

<main>
  <section id="tab-library" class="tab on">
    <aside class="systems" id="systems"></aside>
    <div class="content">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Buscar juego…" autocomplete="off">
        <div class="chips" id="filters">
          <button data-f="all" class="on">Todos</button>
          <button data-f="installed">En la tablet</button>
          <button data-f="missing">No en la tablet</button>
          <button data-f="partial">A medias</button>
        </div>
        <select id="sort" aria-label="Ordenar">
          <option value="name">Nombre</option>
          <option value="size">Tamaño</option>
        </select>
        <button class="ghost" id="rescan" title="Volver a leer la carpeta de ROMs">Actualizar</button>
      </div>
      <div class="summary" id="summary"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </div>
  </section>

  <section id="tab-tablet" class="tab"><div class="page" id="tabletPage"></div></section>
  <section id="tab-saves" class="tab"><div class="page" id="savesPage"></div></section>
  <section id="tab-settings" class="tab"><div class="page" id="settingsPage"></div></section>
</main>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<div class="login" id="login" hidden>
  <form class="card" id="loginForm">
    <img src="icon.svg" alt="" width="56">
    <h2>RomSync</h2>
    <p>Escribe el código que aparece en la ventana de RomSync del PC.</p>
    <input id="loginCode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
    <button class="primary" type="submit">Entrar</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
